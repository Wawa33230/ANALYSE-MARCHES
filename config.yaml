  #  (cibles sur la plomberie/sanitaire/salle de bain - PAS les CPV de construction)
  cpv_cibles:
    "45330000": 30   # Travaux de plomberie
    "45332400": 32   # Travaux d'installation d'appareils sanitaires
    "45332000": 28   # Travaux de plomberie et de pose de conduits d'evacuation
    "45211310": 28   # Salles de bains
    "44411000": 20   # Articles sanitaires (baignoires, douches, receveurs...)
    "45454100": 10   # Travaux de renovation
    # NB : le CPV 45330000 est partage avec les marches "eau chaude/chauffage" ->
    #      ce sont les MOTS-CLES (baignoire, douche, adaptation) qui font le tri.

