  fichier_sortie: "output/tableau-de-bord.html"
  garder_hors_cible: false   # true = afficher aussi les marches "hors cible" dans le tableau

# ===========================================================================
#  E-MAIL AUTOMATIQUE  (recap hebdomadaire des consultations interessantes)
#  Mode d'emploi complet : VEILLE-AUTOMATIQUE-HEBDO.md
#  - L'e-mail n'est envoye QUE lors d'une execution "python -m src.main --email"
#    (c'est ce que fait la tache planifiee hebdomadaire), sauf si
#    envoyer_recap = true ci-dessous (alors chaque lancement enverra un mail).
#  - SECURITE : ne mets JAMAIS ton mot de passe directement ici. Utilise un
#    "mot de passe d'application" Gmail, place soit dans la variable
#    d'environnement VEILLE_SMTP_PASSWORD, soit dans le fichier local
#    motdepasse-mail.txt (ignore par git). Voir la doc.
# ===========================================================================
email:
  envoyer_recap: false                 # true = envoyer un mail a CHAQUE lancement (sinon : seulement avec --email / tache hebdo)
  destinataire: "loyk.duporge@adomsenior.fr"   # a QUI envoyer le recap (change si besoin)
  expediteur:   "loyk.duporge@adomsenior.fr"   # compte Google Workspace qui envoie (= identifiant SMTP)
  smtp_hote: "smtp.gmail.com"          # Google Workspace = meme serveur que Gmail
  smtp_port: 587
  securite: "starttls"                 # "starttls" (port 587, Gmail) ou "ssl" (port 465)
  mot_de_passe_env: "VEILLE_SMTP_PASSWORD"    # variable d'environnement lue en priorite
  mot_de_passe_fichier: "motdepasse-mail.txt" # sinon, fichier local (a NE PAS committer)
  joindre_tableau: true                # joindre le tableau de bord complet au mail (en ZIP :
                                       #  un .html brut avec du JavaScript est parfois bloque
                                       #  ou mis en spam par Gmail -> le recap n'arrivait pas)
  envoyer_si_vide: true                # envoyer meme s'il n'y a aucune nouveaute cette semaine
  email_unique: true                   # true (recommande) = UN SEUL e-mail contenant le recap
                                       #  ET les actions a realiser. false = deux e-mails separes
                                       #  (ancien comportement, moins fiable).
  objet_prefixe: "Veille AO"

# ===========================================================================
#  ALERTES E-MAIL DES PLATEFORMES  (Ternum BFC, achatpublic, maximilien...)
#  La plupart des plateformes n'ont PLUS de flux RSS : elles envoient des
#  ALERTES E-MAIL sur recherche sauvegardee. L'outil lit ta boite Gmail (IMAP,
#  en lecture seule, avec le MEME mot de passe d'application que l'envoi) et
#  transforme ces alertes en consultations (filtrees + scorees comme le reste).
#  Mode d'emploi : VEILLE-AUTOMATIQUE-HEBDO.md (section "Alertes plateformes").
# ===========================================================================
mail_alertes:
  imap_hote: "imap.gmail.com"   # Google Workspace = meme serveur IMAP que Gmail
  imap_port: 993
  compte: "loyk.duporge@adomsenior.fr"   # l'adresse qui RECOIT les alertes (vide = reprend email.expediteur)
  dossier: "Notifications AO"  # libelle Gmail ou sont rangees les alertes. Mets "INBOX" si tu ne filtres pas.
  jours_recents: 14          # ne lire que les alertes des N derniers jours
  seulement_non_lus: false   # true = ne lire que les e-mails non lus
  # Notifications sur des consultations ou tu es DEJA engage (demande de complement,
  # question/reponse, changement de date, document a retirer...) : elles ne remontent
  # PAS comme nouveaux marches, mais declenchent un e-mail "action a realiser".
  email_actions: true        # false = desactiver l'e-mail "action a realiser"
  actions_destinataire: ""   # vide = meme destinataire que le recap (email.destinataire)
  # Filtre des expediteurs :
  #  - si on lit un LIBELLE dedie (ex. "Notifications AO"), TOUS les e-mails du
  #    libelle sont pris en compte (c'est ton filtre Gmail qui decide de ce qui y
  #    entre) -> une nouvelle plateforme est integree automatiquement, rien a faire ici.
  #  - si on lit INBOX, seuls les expediteurs listes ci-dessous sont pris en compte.
  #  Pour forcer un comportement : expediteurs_stricts: true (toujours filtrer)
  #  ou false (ne jamais filtrer).
  # expediteurs_stricts: false
  expediteurs:
    - ternum-bfc.fr
    - achatpublic.com
    - maximilien.fr
    - marches-securises.fr
    - e-marchespublics.com
    - dematis.com              # editeur de e-marchespublics
    - megalis.bretagne.bzh
    - marches-publics.gouv.fr  # PLACE (Etat)
    - atexo                    # moteur de nombreuses plateformes regionales
    - marches-publics.info     # AWS
    - aws-achat.info           # AWS (autre domaine d'envoi)
    - agysoft.fr               # AWS / Marco
    - boamp.fr                 # alertes e-mail du BOAMP
    - ted.europa.eu            # alertes e-mail TED (UE)
    - francemarches.com
    - klekoon.com
    - marchesonline.com
    - centraledesmarches.com
    - achatsolutions.fr
    - spigao.com
    - vecteurplus.com
    - e-bourgogne.fr
