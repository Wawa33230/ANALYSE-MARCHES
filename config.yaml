  # --- EXCLUSIONS : "grosse plomberie" / chauffage / eau chaude collective ---
  #  D'apres l'analyse 5 ans, le 1er pollueur est l'EAU CHAUDE SANITAIRE / CHAUFFAGE
  #  ("production d'eau chaude sanitaire", "exploitation des installations de chauffage").
  #  Ces mots ECARTENT le marche SAUF si un vrai mot-cle salle de bain (baignoire,
  #  douche, adaptation, accessibilite...) est present.
  mots_cles_exclus:
    - chauffage
    - chaudiere
    - chaudieres
    - reseau de chaleur
    - chaufferie
    - eau chaude sanitaire     # faux ami : c'est de l'ECS collective, pas ta cible
    - eau chaude
    - production d'eau chaude
    - production d'eau chaude collective
    - exploitation             # contrats d'exploitation/maintenance chauffage (SERVICES)
    - d'exploitation
    - maintenance des installations
    - desembouage
    - calorifuge
    - cvc
    - climatisation
    - pompe a chaleur
    - genie climatique
    - vmc
    - ventilation
    - gaz
    - fluides medicaux
    - traitement d'eau
    - station d'epuration
    - assainissement
    - espaces verts
    - voirie
    - toiture
    - couverture
    - etancheite

  # --- EXCLUSION "MAINTENANCE / ENTRETIEN COURANT" (contrats de maintenance generale) ---
  #  Tu fais de la RENOVATION de salle de bain, pas de la maintenance courante.
  #  Ces mots ECARTENT le marche SAUF si un vrai mot-cle salle de bain / accessibilite
  #  / adaptation est present (cas d'un accord-cadre avec un lot d'accessibilite).
  mots_cles_maintenance:
