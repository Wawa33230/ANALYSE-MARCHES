# ============================================================================
#  CONFIGURATION - Outil de veille appels d'offres
#  Metier : remplacement baignoire -> douche / accessibilite PMR
#           pour bailleurs sociaux (pose de panneaux muraux, PAS de carrelage)
# ----------------------------------------------------------------------------
#  Tu peux modifier librement ce fichier (avec un simple Bloc-notes) puis
#  relancer l'outil. Tout est commente pour t'y retrouver.
# ============================================================================

recherche:
  jours_recents: 45          # On recupere les annonces publiees dans les N derniers jours
  masquer_echus: true        # Cacher les marches dont la date limite est deja passee

geographie:
  perimetre: national        # "national" = toute la France. Sinon "departements".
  departements: []           # Utilise seulement si perimetre = departements. Ex: ["45","18","44","49"]

sources:
  boamp: true                # Source officielle nationale (recommandee, gratuite)
  ted: true                  # Marches europeens > seuils (gros accords-cadres)
  aws: true                  # marches-publics.info / AWS-Achat (recherche publique)
  plateformes: true          # Flux RSS/Atom des plateformes (voir section "plateformes")

# ---------------------------------------------------------------------------
#  PLATEFORMES (marches-publics.info / AWS, achatpublic.com, marches-securises...)
#  Ces sites n'ont pas d'API publique fiable. La methode robuste et durable :
#    1. Cree un compte (gratuit) sur la plateforme, ex: marches-publics.info
#    2. Fais une recherche (mots-cles "plomberie accessibilite", etc.)
#    3. Enregistre-la en ALERTE / RECHERCHE SAUVEGARDEE et recupere son flux RSS
#    4. Colle l'URL du flux ci-dessous. L'outil l'agregera automatiquement.
#  (Le guide README explique la marche a suivre en images.)
# ---------------------------------------------------------------------------
plateformes:
  flux_rss: []
    # - "https://www.marches-publics.info/...mon-alerte.rss"
    # - "https://www.achatpublic.com/...flux.xml"

# ===========================================================================
#  LOGIQUE DE PERTINENCE  (le coeur de l'outil : ce qui classe les marches)
# ===========================================================================
scoring:

  # --- Mots-cles CIBLE : coeur de ton metier = renovation de salle de bain (gros bonus) ---
  mots_cles_prioritaires:
    - baignoire
    - baignoire en douche
    - remplacement de baignoire
    - depose de baignoire
    - depose baignoire
    - remplacement baignoire par douche
    - pose de douche
    - douche a l'italienne
    - salle de bain
    - salle de bains
    - salle d'eau
    - accessibilite
    - PMR
    - personne a mobilite reduite
    - maintien a domicile
    - adaptation du logement
    - adaptation des logements
    - adaptation salle de bain
    - adaptation salles de bain
    - adaptation        # mot discriminant n1 (cf. analyse 5 ans : "accord-cadre d'adaptation")
    - mobilite reduite
    - mise en accessibilite
    - mise aux normes pmr
    - douche
    - receveur
    - receveur extra plat
    - bac a douche
    - barre de maintien
    - barre de relevage
    - travaux d'accessibilite

  # --- Mots-cles SECONDAIRES : contexte plomberie / sanitaire (bonus moyen) ---
  #  (volontairement limites : on ne veut PAS de construction, juste plomberie sanitaire)
  mots_cles_secondaires:
    - plomberie sanitaire
    - plomberie
    - sanitaire
    - lavabo
    - robinetterie
    - entretien courant
    - amenagement de salle de bain

  # --- Ta SPECIFICITE : pose de panneaux muraux (bonus, te differencie) ---
  mots_cles_panneaux:
    - panneau mural
    - panneaux muraux
    - habillage mural
    - dalle murale
    - kinewall
    - wedi
    - sans carrelage

  # --- Codes CPV pertinents : valeur = nombre de points accordes ---
  #  (cibles sur la plomberie/sanitaire/salle de bain - PAS les CPV de construction)
  cpv_cibles:
    "45330000": 30   # Travaux de plomberie
    "45332400": 32   # Travaux d'installation d'appareils sanitaires
    "45332000": 28   # Travaux de plomberie et de pose de conduits d'evacuation
    "45211310": 28   # Salles de bains
    "44411000": 20   # Articles sanitaires (baignoires, douches, receveurs...)
    "45454100": 10   # Travaux de renovation
    # NB : le CPV 45330000 est partage avec les marches "eau chaude/chauffage" ->
    #      ce sont les MOTS-CLES (baignoire, douche, adaptation) qui font le tri.

  # --- CLIENTS CIBLES : bailleurs deja clients (ex-apporteur d'affaires) ---
  #  Un marche dont l'acheteur correspond a l'un de ces noms recoit un gros bonus
  #  et le drapeau "client connu". BOAMP recherche aussi directement par ces noms.
  #  (issu de ton fichier Marches.csv - 58 bailleurs, nettoye)
  bailleurs_cibles:
    - "13 habitat"
    - clairsienne
    - immobiliere rhone alpes
    - orne habitat
    - aiguillon construction
    - archipel habitat
    - aveyron habitat
    - brest metropole habitat
    - correze habitat
    - cote d'azur habitat
    - creusalis
    - domanys
    - eneal
    - erilia
    - espacil
    - est ensemble habitat
    - france loire
    - habitat audois
    - habitat hdf
    - habitat perpignan
    - hamaris
    - haute savoie habitat
    - in cite
    - ligeris
    - lot habitat
    - manche habitat
    - mesolia
    - montlucon habitat
    - morbihan habitat
    - noalis
    - nove gestion
    - odhac
    - oph de l'ariege
    - perigord habitat
    - polygone
    - sa hlm de l'oise
    - sevre loire habitat
    - sikoa
    - simar
    - un toit pour tous
    - val de berry
    - ozanam
    - agglo de la rochelle
    - logiouest

  # --- Indices "bailleur social" dans le nom de l'acheteur (bonus unique) ---
  indices_bailleur:
    - habitat
    - office public
    - oph
    - hlm
    - esh
    - logement
    - logements
    - logis
    - immobiliere
    - residences
    - residence sociale
    - foyer
    - sem
    - economie mixte
    - toit
    - val de loire
    - france loire
    - logiouest

  # --- Type de marche favorable (bonus unique) ---
  types_favorables:
    - accord-cadre
    - accord cadre
    - bons de commande
    - bon de commande
    - multi-attributaires

  # --- EXCLUSIONS "CONSTRUCTION / GROS OEUVRE" (tu fais UNIQUEMENT de la renovation SDB) ---
  #  Ces mots ECARTENT le marche SAUF si un vrai mot-cle "salle de bain / douche /
  #  baignoire / accessibilite" est present. Ils eliminent la construction neuve,
  #  les rehabilitations lourdes tous corps d'etat, la maconnerie, etc.
  mots_cles_construction:
    - construction
    - construction neuve
    - logements neufs
    - maison individuelle
    - maisons individuelles
    - gros oeuvre
    - gros-oeuvre
    - maconnerie
    - charpente
    - terrassement
    - vrd
    - voirie et reseaux
    - extension
    - surelevation
    - demolition reconstruction
    - amenagement exterieur
    - espaces verts
    - ravalement
    - ravalement de facade
    - isolation thermique exterieure
    - batiment neuf

  # --- EXCLUSIONS : "grosse plomberie" / chauffage / eau chaude collective ---
  #  D'apres l'analyse 5 ans, le 1er pollueur est l'EAU CHAUDE SANITAIRE / CHAUFFAGE
  #  ("production d'eau chaude sanitaire", "exploitation des installations de chauffage").
  #  Ces mots ECARTENT le marche SAUF si un vrai mot-cle salle de bain (baignoire,
  #  douche, adaptation, accessibilite...) est present.
  mots_cles_exclus:
    - chauffage
    - chaudiere
    - chaudieres
    - reseau de chaleur
    - chaufferie
    - eau chaude sanitaire     # faux ami : c'est de l'ECS collective, pas ta cible
    - eau chaude
    - production d'eau chaude
    - production d'eau chaude collective
    - exploitation             # contrats d'exploitation/maintenance chauffage (SERVICES)
    - d'exploitation
    - maintenance des installations
    - desembouage
    - calorifuge
    - cvc
    - climatisation
    - pompe a chaleur
    - genie climatique
    - vmc
    - ventilation
    - gaz
    - fluides medicaux
    - traitement d'eau
    - station d'epuration
    - assainissement
    - espaces verts
    - voirie
    - toiture
    - couverture
    - etancheite

  # --- Signal CARRELAGE (tu poses des panneaux, pas du carrelage) ---
  #  Ne supprime pas le marche : il est seulement signale (drapeau) et
  #  legerement retrograde si aucun mot-cle "panneau" n'est present.
  mots_cles_carrelage:
    - carrelage
    - faience
    - carreleur

  # --- Seuils de categorisation (sur le score final, de 0 a 100) ---
  seuil_prioritaire: 55      # >= 55  => CIBLE PRIORITAIRE (vert)
  seuil_a_regarder: 28       # >= 28  => A REGARDER (orange) ; en dessous => HORS CIBLE (rouge)

affichage:
  ouvrir_navigateur: true
  fichier_sortie: "output/tableau-de-bord.html"
  garder_hors_cible: false   # true = afficher aussi les marches "hors cible" dans le tableau
