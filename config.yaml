# ============================================================================
#  CONFIGURATION - Outil de veille appels d'offres
#  Metier : remplacement baignoire -> douche / accessibilite PMR
#           pour bailleurs sociaux (pose de panneaux muraux, PAS de carrelage)
# ----------------------------------------------------------------------------
#  Tu peux modifier librement ce fichier (avec un simple Bloc-notes) puis
#  relancer l'outil. Tout est commente pour t'y retrouver.
# ============================================================================

recherche:
  jours_recents: 45          # On recupere les annonces publiees dans les N derniers jours
  masquer_echus: true        # Cacher les marches dont la date limite est deja passee
  masquer_sans_date_limite: false   # true = cacher aussi les marches dont la date limite
                                     # est inconnue (souvent des avis TED). Par defaut on
                                     # les affiche avec un drapeau "a verifier".

geographie:
  perimetre: national        # "national" = toute la France. Sinon "departements".
  departements: []           # Utilise seulement si perimetre = departements. Ex: ["45","18","44","49"]

sources:
  boamp: true                # Source officielle nationale (recommandee, gratuite)
  ted: true                  # Marches europeens > seuils (gros accords-cadres)
  aws: true                  # marches-publics.info / AWS-Achat (recherche publique)
  plateformes_web: true      # Autres plateformes web (maximilien, achatpublic... voir "plateformes_web")
  plateformes: true          # Flux RSS/Atom des plateformes (voir section "plateformes")
  mail_alertes: true         # Lit les ALERTES E-MAIL des plateformes dans ta boite Gmail
                             #  (Ternum BFC, achatpublic, maximilien... qui n'ont pas de RSS).
                             #  Voir section "mail_alertes" plus bas + VEILLE-AUTOMATIQUE-HEBDO.md

# ---------------------------------------------------------------------------
#  PLATEFORMES WEB (scrapers dedies, ajoutees "une par une")
#  Chaque plateforme non encore calibree (calibre: false) genere au 1er lancement
#  un fichier data/<slug>-debug.html : envoie-le pour que je finalise son lecteur,
#  puis on passe calibre: true. (maximilien = Ile-de-France, prioritaire.)
#  NB : les URL ci-dessous sont des points de depart, ajustes lors du calibrage.
# ---------------------------------------------------------------------------
plateformes_web:
  # e-marchespublics : parseur dedie (calibre). Champ de recherche "what".
  - nom: "e-marchespublics.com"
    slug: e-marchespublics
    url: "https://www.e-marchespublics.com/appel-offre"
    methode: GET
    champ_motcle: "what"
    champ_page: "page"
    champs_fixes: {where: "all"}
    parseur: emp
    actif: true
    calibre: true

  # achatpublic : resultats charges en JavaScript (AJAX) -> non lisibles en direct.
  # Decision : couvert via alerte "Enregistrer ma recherche" (pas de scraping).
  # (Endpoint conserve pour reference si on change d'avis un jour.)
  - nom: "achatpublic.com"
    slug: achatpublic
    url: "https://www.achatpublic.com/sdm/ent2/gen/rechercheCsl.action"
    methode: POST
    champ_motcle: "searchCslBean.intitule"
    encodage: "ISO-8859-15"
    parseur: cartes
    actif: true          # SONDE : au 1er lancement, enregistre data/achatpublic-debug.html
    calibre: false       #  (envoie-moi ce fichier pour que je finalise le lecteur achatpublic)

  # Scraping abandonne (site JS / connexion refusee) -> utiliser leurs alertes RSS.
  - nom: "maximilien.fr (IDF)"
    slug: maximilien
    url: "https://www.maximilien.fr/"
    actif: false
    calibre: false
  - nom: "marches-securises.fr"
    slug: marches-securises
    url: "https://www.marches-securises.fr/entreprise/"
    actif: false
    calibre: false

# ---------------------------------------------------------------------------
#  AUTRES PLATEFORMES via FLUX RSS (methode universelle pour "toutes les sources")
#  Chaque plateforme a sa propre techno : il n'existe PAS d'API unique. La methode
#  robuste et durable pour couvrir N'IMPORTE QUELLE plateforme :
#    1. Cree un compte (gratuit) sur la plateforme
#    2. Fais une recherche (ex: "adaptation PMR", "plomberie accessibilite")
#    3. Enregistre-la en ALERTE / RECHERCHE SAUVEGARDEE et recupere son URL de FLUX RSS
#    4. Colle l'URL ci-dessous. L'outil l'agrege automatiquement (filtre + score compris).
#
#  Principales plateformes francaises a couvrir (cree une alerte RSS sur chacune) :
#    - marches-publics.info (AWS)      -> deja couvert directement (source "aws")
#    - maximilien.fr                    -> Ile-de-France (bailleurs franciliens ++)
#    - achatpublic.com
#    - marches-securises.fr
#    - e-marchespublics.com (Dematis)
#    - megalis.bretagne.bzh             -> Bretagne
#    - PLACE (marches-publics.gouv.fr)  -> Etat
#    - ternum-bfc.fr, ledauphine/atexo regionales, etc.
#  (Beaucoup de marches sont AUSSI publies sur BOAMP/TED, deja couverts.)
# ---------------------------------------------------------------------------
#  >>> COMMENT ACTIVER UNE PLATEFORME (mode d'emploi complet : PLATEFORMES-RSS.md) <<<
#  1. Cree un compte GRATUIT sur la plateforme.
#  2. Lance une recherche (ex : "adaptation PMR", "remplacement baignoire douche",
#     "salle de bain", "plomberie accessibilite") + ta zone geographique.
#  3. Clique sur l'icone RSS des resultats (ou "Enregistrer / M'alerter") et
#     COPIE l'URL du flux RSS.
#  4. Decommente la ligne correspondante ci-dessous et colle l'URL a la place de
#     COLLE_ICI. L'outil agrege, filtre et score automatiquement (comme le BOAMP).
#
#  Chaque entree : { nom: "libelle affiche", url: "...", acheteur: "optionnel" }
plateformes:
  flux_rss:
    # --- Plateformes regionales (moteur Atexo/MPE - RSS public possible) ---
    # - { nom: "Ternum BFC (Bourgogne-Franche-Comte)", url: "COLLE_ICI" }
    # - { nom: "Maximilien (Ile-de-France)",           url: "COLLE_ICI" }
    # - { nom: "Megalis Bretagne",                     url: "COLLE_ICI" }
    # - { nom: "PLACE - Etat (marches-publics.gouv.fr)", url: "COLLE_ICI" }
    # --- Plateformes nationales / editeurs prives ---
    # - { nom: "achatpublic.com",        url: "COLLE_ICI" }
    # - { nom: "marches-securises.fr",   url: "COLLE_ICI" }
    # - { nom: "e-marchespublics (Dematis)", url: "COLLE_ICI" }
    # - { nom: "marches-publics.info (AWS)", url: "COLLE_ICI" }
    # --- Tu peux ajouter autant de flux que tu veux (autres regions, JAL, etc.) ---
    # - { nom: "Autre plateforme",       url: "COLLE_ICI" }

