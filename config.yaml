    - reparation
    - multiservices
    - multi-services
    - multitechnique
    - petits travaux
    - depannage
    - remise en etat des logements
    - tous corps d'etat
    - tous corps d'etat (tce)

  # --- Signal CARRELAGE (tu poses des panneaux, pas du carrelage) ---
  #  Ne supprime pas le marche : il est seulement signale (drapeau) et
  #  legerement retrograde si aucun mot-cle "panneau" n'est present.
  mots_cles_carrelage:
    - carrelage
    - faience
    - carreleur

  # --- Restreindre aux bailleurs sociaux ? ---
  #  PHILOSOPHIE : on RATISSE LARGE (tous acheteurs, toutes procedures dont MAPA) et
  #  c'est le SCORING (mots-cles + CPV) qui fait l'entonnoir. La liste de bailleurs
  #  ne sert donc QU'A donner un bonus "client connu" + un filet de rappel BOAMP,
  #  JAMAIS a filtrer.
  #  false = on garde tout marche pertinent, quel que soit l'acheteur (RECOMMANDE).
  #  true  = (ancien comportement) ecarte tout acheteur non identifie comme bailleur.
  uniquement_bailleurs: false

  # --- Exclure les collectivites (mairie, commune, departement, region...) ? ---
  #  false = on garde meme les collectivites si le marche colle a nos criteres
  #          (une commune / un CCAS / un foyer peut lancer un marche PMR salle de bain).
  #  true  = on ecarte les acheteurs "collectivite" non identifies comme bailleurs.
  exclure_collectivites: false

  # --- Seuils de categorisation (sur le score final, de 0 a 100) ---
  seuil_prioritaire: 55      # >= 55  => CIBLE PRIORITAIRE (vert)
  seuil_a_regarder: 28       # >= 28  => A REGARDER (orange) ; en dessous => HORS CIBLE (rouge)

affichage:
